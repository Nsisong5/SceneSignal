[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scene-signal"
version = "0.1.0"
description = "Turn video into timestamped editing intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SceneSignal Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.2.0",
    "jsonschema>=4.21.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
]

[project.scripts]
scene-signal = "scene_signal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scene_signal"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "requires_ffmpeg: mark test as requiring ffmpeg and ffprobe on PATH",
    "contract: contract validation tests",
    "integration: integration tests requiring external services or credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = []
